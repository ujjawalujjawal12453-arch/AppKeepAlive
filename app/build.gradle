plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autotap.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.autotap.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName '1.0'
    }

    // Har build usi ek pakki key se sign hota hai, taaki naya version purane ke upar install ho
    // aur phone me saved IDs bachi rahein.
    signingConfigs {
        autotap {
            storeFile rootProject.file("signing/autotap.keystore")
            storePassword "autotap123"
            keyAlias "autotap"
            keyPassword "autotap123"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.autotap
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
